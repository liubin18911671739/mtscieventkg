domain_concepts:
  - "AI for Science"
  - "scientific discovery"
  - "materials informatics"
time_range: [2016, 2025]
languages: ["en", "zh", "fr", "es"]

data:
  dummy_records: 200          # number of synthetic papers per language when raw data is missing
  seed: 42

openalex:
  api_base: "https://api.openalex.org/works"
  per_page: 200
  max_pages: 5                # safety cap for quick demo; raise for full crawl
  sleep: 0.5

llm:
  provider: "zhipu"           # zhipu | openai | local
  model: "glm-4-air"
  temperature: 0.2
  max_tokens: 1200
  top_p: 0.9
  system_prompt: "You are a multilingual scientific event extraction assistant."
  api_key_env: "ZHIPUAI_API_KEY"

zhipu:
  api_base: "https://open.bigmodel.cn/api/paas/v4/chat/completions"

local_llm:
  model_name: "meta-llama/Llama-3-8b-instruct"   # used only when provider == local
  device: "cpu"
  max_new_tokens: 512

embedding:
  model_name: "intfloat/multilingual-e5-base"
  batch_size: 64
  normalize: true
  knn: 3
  align_threshold: 0.22
  candidates:
    - "intfloat/multilingual-e5-base"
    - "intfloat/multilingual-e5-large"
    - "sentence-transformers/LaBSE"

train:
  batch_size: 128
  lr: 0.001
  epochs: 5                   # keep small for demo; adjust in real runs
  hidden_dim: 256
  dropout: 0.1
  history_len: 8
  lambda_align: 0.5
  lambda_kd: 1.0
  lambda_tkgr: 1.0
  kd_temperature: 2.0
  device: "auto"              # "auto" | "cpu" | "cuda"

eval:
  hits_k: [1, 3, 5, 10]
